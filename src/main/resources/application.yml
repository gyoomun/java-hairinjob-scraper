spring:
  application:
    name: java-hairinjob

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hairinjob}
    username: ${DB_USER:hairinjob_user}
    password: ${DB_PASSWORD:hairinjob2024!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  task:
    execution:
      pool:
        core-size: 10
        max-size: 10
        queue-capacity: 100
      thread-name-prefix: scraper-

logging:
  level:
    root: ERROR
    org.nicenomu.hairinjob: INFO
    org.springframework.boot: ERROR
    org.hibernate: ERROR
    com.zaxxer.hikari: ERROR
  pattern:
    console: "%d{HH:mm:ss.SSS} %msg%n"

scraper:
  target-url: https://www.hairinjob.com
  login:
    username: ${SCRAPER_USERNAME:01028721278}
    password: ${SCRAPER_PASSWORD:235194}
  browser:
    user-data-dir: ${USER_DATA_DIR:./playwright-data}
    headless: ${HEADLESS:false}
  cookie-refresh-interval-minutes: 20
  request-delay-min-ms: 1000  # 300ms → 1000ms (Python과 동일)
  request-delay-max-ms: 3000  # 1000ms → 3000ms (Python과 동일)
