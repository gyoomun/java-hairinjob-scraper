spring:
  application:
    name: java-hairinjob

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hairinjob}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  task:
    execution:
      pool:
        core-size: 10
        max-size: 10
        queue-capacity: 100
      thread-name-prefix: scraper-

logging:
  level:
    root: INFO
    org.nicenomu.hairinjob: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

scraper:
  target-url: https://www.hairinjob.com
  login:
    username: ${SCRAPER_USERNAME:01028721278}
    password: ${SCRAPER_PASSWORD:235194}
  browser:
    user-data-dir: ${USER_DATA_DIR:./playwright-data}
    headless: ${HEADLESS:false}
  cookie-refresh-interval-minutes: 20
  request-delay-min-ms: 300
  request-delay-max-ms: 1000
